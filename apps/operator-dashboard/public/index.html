<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Operator dashboard</h1>
    <p id="status" class="status" role="status" aria-live="polite">Loading…</p>
  </header>
  <div id="error" class="banner" role="alert" hidden></div>
  <main>
    <section aria-labelledby="machines-title">
      <h2 id="machines-title">Machines</h2>
      <div id="machines"></div>
      <h3>Live daemon check</h3>
      <div id="daemon"></div>
    </section>
    <section aria-labelledby="calls-title">
      <h2 id="calls-title">Calls today</h2>
      <div id="calls"></div>
    </section>
    <section aria-labelledby="tasks-title">
      <h2 id="tasks-title">Tasks by state</h2>
      <div id="tasks"></div>
    </section>
    <section aria-labelledby="timeline-title" class="wide">
      <h2 id="timeline-title">Recent activity</h2>
      <div id="timeline"></div>
    </section>
  </main>
</body>
</html>
